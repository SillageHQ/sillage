[package]
name = "sillage"
version = "1.0.0-beta.10"
description = "The contextual memory layer for Obsidian"
authors = ["JB Holdings SIA"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sillage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-full = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
chrono = "0.4"
walkdir = "2"
sha2 = "0.10"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
rand = "0.9"
tiny_http = "0.12"
url = "2"
dirs = "6"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
tokenizers = "0.22"

[dev-dependencies]
tempfile = "3"
