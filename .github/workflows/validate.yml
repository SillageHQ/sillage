name: Validate pull request

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level=low

      - name: Audit desktop lockfile
        run: pnpm --dir apps/desktop audit --ignore-workspace --audit-level=low

      - name: Typecheck desktop
        run: pnpm --filter @sb/desktop exec tsc --noEmit

      - name: Test desktop
        run: pnpm --filter @sb/desktop test

      - name: Test API
        run: pnpm --filter @sb/api test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test retrieval evaluation metrics
        run: python services/memory/evaluation/test_metrics.py
